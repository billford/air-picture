<!doctype html>
<!--
  The site moved to Cloudflare Pages on 2026-08-06 (see build_and_push.sh).
  This is the whole of what GitHub Pages serves now: the same file as
  index.html and 404.html, so every old github.io URL — the report list, the
  dashboard, any single report — lands here and is sent on to the same path
  on pages.dev. Deployed once by .github/workflows/pages-redirect.yml; it
  never needs redeploying, because it holds no data.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Picture has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://air-picture.pages.dev/">
<meta http-equiv="refresh" content="2; url=https://air-picture.pages.dev/">
<script>
  (function () {
    var path = location.pathname.replace(/^\/air-picture/, "") || "/";
    location.replace("https://air-picture.pages.dev" + path + location.search + location.hash);
  })();
</script>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 3rem auto; max-width: 32rem; padding: 0 16px; }
</style>
</head>
<body>
<p>Air Picture has moved to <a href="https://air-picture.pages.dev/">air-picture.pages.dev</a>.</p>
</body>
</html>
